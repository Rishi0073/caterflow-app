name: caterflow_app
description: "A premium job platform for catering professionals."

# The following line prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

  # Premium typography from Google Fonts
  google_fonts: ^6.1.0

  # To open Google Maps for directions
  url_launcher: ^6.2.5

  # For accessing device GPS location
  geolocator: ^11.0.0

  # For formatting dynamic dates (Today, Tomorrow, etc.)
  intl: ^0.19.0

  # --- FIREBASE DEPENDENCIES ---
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # For QR code scanning
  mobile_scanner: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can also be referenced by its path:
  # assets:
  #   - assets/images/logo.png

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages